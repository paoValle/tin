<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260" role="img" aria-labelledby="t d">
  <title id="t">Tin, the tin-can mascot</title>
  <desc id="d">A friendly tin can robot with a glowing antenna that waves, blinks and bobs.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d99a8"/>
      <stop offset="0.25" stop-color="#e9eef4"/>
      <stop offset="0.55" stop-color="#b7c1cc"/>
      <stop offset="1" stop-color="#7c8896"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9fc"/>
      <stop offset="1" stop-color="#aab5c1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe37a"/>
      <stop offset="0.6" stop-color="#ffb02e"/>
      <stop offset="1" stop-color="#ffb02e" stop-opacity="0"/>
    </radialGradient>
    <style>
      .bob { animation: bob 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
      .shadow { animation: shadow 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
      .wave { animation: wave 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: 8% 90%; }
      .blink { animation: blink 4s infinite; transform-box: fill-box; transform-origin: 50% 50%; }
      .pulse { animation: pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
      .sway { animation: sway 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes shadow { 0%,100% { transform: scale(1); opacity: .28; } 50% { transform: scale(.82); opacity: .16; } }
      @keyframes wave { 0%,100% { transform: rotate(8deg); } 50% { transform: rotate(-28deg); } }
      @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.35); opacity: 1; } }
      @keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
      @media (prefers-reduced-motion: reduce) { .bob,.shadow,.wave,.blink,.pulse,.sway { animation: none; } }
    </style>
  </defs>

  <ellipse class="shadow" cx="120" cy="244" rx="62" ry="9" fill="#1b2430"/>

  <g class="bob">
    <!-- antenna -->
    <g class="sway">
      <rect x="117" y="22" width="6" height="30" rx="3" fill="#7c8896"/>
      <circle class="pulse" cx="120" cy="20" r="14" fill="url(#glow)"/>
      <circle cx="120" cy="20" r="6.5" fill="#ffcf4d" stroke="#d98a00" stroke-width="2"/>
    </g>

    <!-- waving arm (behind the body edge, on the right) -->
    <g class="wave">
      <path d="M176 134 C198 128 210 116 214 96" fill="none" stroke="#7c8896" stroke-width="9" stroke-linecap="round"/>
      <circle cx="214" cy="92" r="11" fill="#e9eef4" stroke="#7c8896" stroke-width="3"/>
    </g>

    <!-- left arm -->
    <path d="M64 142 C46 150 40 166 44 182" fill="none" stroke="#7c8896" stroke-width="9" stroke-linecap="round"/>
    <circle cx="44" cy="186" r="10" fill="#e9eef4" stroke="#7c8896" stroke-width="3"/>

    <!-- can body -->
    <rect x="62" y="48" width="116" height="168" rx="16" fill="url(#metal)" stroke="#6f7b89" stroke-width="3"/>
    <!-- ridges -->
    <g fill="none" stroke="#6f7b89" stroke-opacity=".55" stroke-width="2.5">
      <path d="M62 78 H178"/><path d="M62 186 H178"/>
    </g>
    <!-- lid -->
    <ellipse cx="120" cy="50" rx="58" ry="12" fill="url(#lid)" stroke="#6f7b89" stroke-width="3"/>
    <ellipse cx="120" cy="50" rx="40" ry="7" fill="none" stroke="#6f7b89" stroke-opacity=".5" stroke-width="2"/>

    <!-- face plate -->
    <rect x="80" y="94" width="80" height="62" rx="14" fill="#1f2a37"/>
    <!-- eyes -->
    <g class="blink">
      <ellipse cx="102" cy="120" rx="8" ry="10" fill="#7fe3ff"/>
      <ellipse cx="138" cy="120" rx="8" ry="10" fill="#7fe3ff"/>
      <circle cx="104.5" cy="117" r="2.6" fill="#ffffff"/>
      <circle cx="140.5" cy="117" r="2.6" fill="#ffffff"/>
    </g>
    <!-- smile -->
    <path d="M104 140 Q120 152 136 140" fill="none" stroke="#7fe3ff" stroke-width="4" stroke-linecap="round"/>
    <!-- cheeks -->
    <circle cx="88" cy="136" r="5" fill="#ff8fa3" fill-opacity=".55"/>
    <circle cx="152" cy="136" r="5" fill="#ff8fa3" fill-opacity=".55"/>

    <!-- label -->
    <rect x="80" y="166" width="80" height="34" rx="6" fill="#f2f5f8" stroke="#6f7b89" stroke-width="2"/>
    <text x="120" y="190" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#1f2a37">tin</text>

    <!-- feet -->
    <rect x="76" y="214" width="34" height="14" rx="7" fill="#6f7b89"/>
    <rect x="130" y="214" width="34" height="14" rx="7" fill="#6f7b89"/>
  </g>
</svg>
